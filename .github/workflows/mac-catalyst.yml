name: Mac Catalyst compatibility probe (not a full app build)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mac-catalyst
    paths:
      - .github/workflows/mac-catalyst.yml
      - tools/mac-catalyst-probe.sh
      - Telegram/Telegram-iOS/Application.swift
      - Telegram/Telegram-iOS/main.m
      - Telegram/BUILD
      - docs/macos-catalyst-port.md

permissions:
  contents: read

jobs:
  mac-catalyst-source-probe:
    name: Type-check Swiftgram entry points for Mac Catalyst
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show Apple toolchain
        run: |
          uname -a
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun swiftc --version
      - name: Compile-check actual Swiftgram entry-point sources for macabi
        run: bash tools/mac-catalyst-probe.sh
      - name: Explain validation scope
        if: always()
        run: |
          {
            echo '## Mac Catalyst migration status'
            echo ''
            echo 'This job tests the **existing Swiftgram application entry-point sources** against the Mac Catalyst toolchain.'
            echo 'It does **not** produce a complete Swiftgram application, and a successful run is not proof that the Bazel dependency graph supports Mac Catalyst.'
            echo ''
            echo 'The existing app remains an `ios_application`; the bundled rules_xcodeproj tool does not currently support a `catalyst` top-level target environment.'
            echo 'A real release must compile and link the full Swiftgram UI/core graph for macabi, produce a macOS .app, and pass the bundle/binary validation described in docs/macos-catalyst-port.md.'
          } >> "$GITHUB_STEP_SUMMARY"
